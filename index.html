<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>CT Practical Examination - Brain &amp; Spine</title>
  <style>
    :root {
      --bg-app: #020617;
      --bg-panel: #0b1120;
      --bg-card: #131c31;
      --bg-card-hover: #1b2845;
      --border-subtle: rgba(148, 163, 184, 0.22);
      --border-strong: rgba(56, 189, 248, 0.45);
      --text-primary: #f8fafc;
      --accent-cyan: #38bdf8;
      --accent-gold: #fbbf24;
      --correct-bg: #16a34a;
      --correct-border: #4ade80;
      --wrong-bg: #dc2626;
      --wrong-border: #f87171;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 600px;
      height: 100dvh;
      max-height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-panel);
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 601px) {
      .app-shell {
        border-left: 1px solid var(--border-subtle);
        border-right: 1px solid var(--border-subtle);
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
      }
    }

    .hidden { display: none !important; }

    /* ================= ACTIVE EXAM SCREEN ================= */
    .exam-screen {
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-panel);
    }

    /* Top Header Bar */
    .top-header {
      flex-shrink: 0;
      background-color: #060b16;
      border-bottom: 1px solid var(--border-subtle);
    }

    .top-header-row {
      height: 38px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hud-group { display: flex; align-items: center; gap: 6px; }

    .hud-pill {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #e2e8f0;
      white-space: nowrap;
      direction: rtl;
    }

    .hud-pill.station-pill { color: var(--accent-cyan); border-color: rgba(56, 189, 248, 0.38); }

    .hud-pill.timer-pill {
      direction: ltr;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 800;
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.45);
      min-width: 62px;
      text-align: center;
    }

    .hud-pill.timer-pill.timer-warn { color: #fcd34d; border-color: rgba(245, 158, 11, 0.7); background: rgba(245, 158, 11, 0.18); }
    .hud-pill.timer-pill.timer-danger { color: #fca5a5; border-color: rgba(239, 68, 68, 0.85); background: rgba(220, 38, 38, 0.28); }

    .timer-track { width: 100%; height: 3px; background: rgba(30, 41, 59, 0.85); }
    .timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #10b981, #38bdf8); transition: width 0.25s linear; }
    .timer-fill.timer-warn { background: #f59e0b; }
    .timer-fill.timer-danger { background: #ef4444; }

    /* Upper PACS Image Viewer (~28dvh) */
    .ct-viewer-zone {
      flex: 0 0 28dvh;
      max-height: 235px;
      min-height: 132px;
      background-color: #030712;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      cursor: zoom-in;
      overflow: hidden;
    }

    .ct-viewer-zone.no-zoom { cursor: default; }

    .image-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ct-scan-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .img-placeholder {
      width: 100%;
      max-width: 290px;
      height: 100%;
      max-height: 185px;
      border-radius: 10px;
      background: #0f172a;
      border: 1.5px dashed rgba(148, 163, 184, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px;
      text-align: center;
    }

    .img-placeholder-title {
      font-family: var(--font-mono);
      font-size: 0.84rem;
      font-weight: 800;
      color: #94a3b8;
    }

    .img-placeholder-sub {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: #64748b;
    }

    .zoom-badge {
      position: absolute;
      bottom: 6px;
      right: 8px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.32);
      color: #e2e8f0;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      pointer-events: none;
    }

    /* Sticky Diagnosis Banner */
    .sticky-diagnosis-bar {
      flex-shrink: 0;
      height: 34px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .sticky-diagnosis-bar.state-prompt {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.16), rgba(15, 23, 42, 0.96), rgba(245, 158, 11, 0.16));
      border-bottom-color: rgba(245, 158, 11, 0.4);
    }

    .sticky-diagnosis-bar.state-locked {
      background: linear-gradient(90deg, rgba(22, 163, 74, 0.22), rgba(15, 23, 42, 0.96), rgba(22, 163, 74, 0.22));
      border-bottom-color: rgba(74, 222, 128, 0.5);
    }

    .sticky-diag-label {
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sticky-diagnosis-bar.state-prompt .sticky-diag-label { direction: rtl; color: var(--accent-gold); }
    .sticky-diagnosis-bar.state-locked .sticky-diag-label { direction: ltr; color: #4ade80; }

    /* Question & 4 MCQ Options Workspace */
    .mcq-workspace {
      flex: 1 1 auto;
      min-height: 0;
      padding: 8px 12px 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      overflow: hidden;
    }

    .question-header {
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .question-text {
      font-size: clamp(13px, 3.6vw, 16px);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      text-align: left;
      direction: ltr;
    }

    .timeout-tag {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 800;
      color: #fca5a5;
      background: rgba(220, 38, 38, 0.24);
      border: 1px solid rgba(248, 113, 113, 0.5);
      padding: 2px 7px;
      border-radius: 6px;
      direction: rtl;
      white-space: nowrap;
    }

    .options-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .option-btn {
      width: 100%;
      flex: 1 1 0;
      min-height: 38px;
      padding: 5px 10px;
      border-radius: 10px;
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      color: #f1f5f9;
      font-family: inherit;
      text-align: left;
      direction: ltr;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }

    .option-btn:hover:not(:disabled) { background-color: var(--bg-card-hover); border-color: rgba(56, 189, 248, 0.48); }
    .option-btn:disabled { cursor: default; }

    .opt-key {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(148, 163, 184, 0.16);
      color: var(--accent-cyan);
      font-size: 0.76rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .opt-text {
      flex: 1;
      font-size: clamp(11.5px, 3.1vw, 14px);
      font-weight: 600;
      line-height: 1.24;
      color: inherit;
    }

    .opt-status-icon { font-size: 0.95rem; font-weight: 900; flex-shrink: 0; }
    .option-btn.opt-correct { background-color: var(--correct-bg); border-color: var(--correct-border); color: #ffffff; }
    .option-btn.opt-correct .opt-key { background-color: rgba(255, 255, 255, 0.24); color: #ffffff; }
    .option-btn.opt-wrong { background-color: var(--wrong-bg); border-color: var(--wrong-border); color: #ffffff; }
    .option-btn.opt-wrong .opt-key { background-color: rgba(255, 255, 255, 0.24); color: #ffffff; }
    .option-btn.opt-muted { opacity: 0.6; }

    /* Fixed Bottom Navigation Bar */
    .bottom-nav-bar {
      flex-shrink: 0;
      min-height: calc(48px + env(safe-area-inset-bottom));
      padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
      background-color: #060b16;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      direction: rtl;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      flex: 1 1 50%;
      height: 36px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      direction: rtl;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .nav-btn-prev { background-color: #1e293b; border: 1px solid rgba(148, 163, 184, 0.3); color: #e2e8f0; }
    .nav-btn-next { background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); border: 1px solid rgba(56, 189, 248, 0.5); color: #ffffff; }
    .nav-btn-next.is-finish { background: linear-gradient(135deg, #059669 0%, #16a34a 100%); border-color: #4ade80; }

    /* ================= RESULTS SCREEN ================= */
    .results-screen {
      flex: 1 1 auto;
      height: 100dvh;
      overflow-y: auto;
      padding: 16px 12px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: radial-gradient(circle at top, #111d36 0%, #0b1120 60%, #020617 100%);
    }

    .score-summary-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-strong);
      border-radius: 16px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .score-ring {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 5px solid var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-percent { font-size: 1.6rem; font-weight: 900; color: #ffffff; line-height: 1.1; }
    .score-fraction { font-family: var(--font-mono); font-size: 0.84rem; font-weight: 700; color: var(--accent-cyan); margin-top: 2px; }

    .restart-exam-btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 800;
      direction: rtl;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .stations-review-list { display: flex; flex-direction: column; gap: 14px; }
    .review-station-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px; overflow: hidden; }

    .review-station-top {
      background: rgba(6, 11, 22, 0.94);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .review-thumb-wrap {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: #020617;
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .review-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .review-thumb-fallback { font-family: var(--font-mono); font-size: 0.58rem; font-weight: 800; color: #94a3b8; text-align: center; padding: 2px; }
    .review-station-info { flex: 1; min-width: 0; }
    .review-station-badge { font-size: 0.75rem; font-weight: 800; color: var(--accent-cyan); direction: rtl; display: inline-block; }
    .review-station-title { font-size: 0.92rem; font-weight: 800; color: var(--accent-gold); margin-top: 2px; }

    .review-q-stack { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .review-q-box { padding: 8px 10px; border-radius: 9px; background: rgba(11, 17, 32, 0.8); border: 1px solid rgba(148, 163, 184, 0.16); display: flex; flex-direction: column; gap: 4px; }
    .review-q-box.is-diag-q { background: rgba(56, 189, 248, 0.08); border-color: rgba(56, 189, 248, 0.32); }
    .review-q-prompt { font-size: 0.82rem; font-weight: 700; color: #f8fafc; direction: ltr; text-align: left; }
    .review-q-row { font-size: 0.78rem; line-height: 1.35; display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px; }
    .ar-label { direction: rtl; font-weight: 800; }
    .txt-green { color: #4ade80; font-weight: 700; }
    .txt-red { color: #f87171; font-weight: 700; }

    /* ================= FULLSCREEN LIGHTBOX ZOOM MODAL ================= */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.97);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      touch-action: pinch-zoom;
    }

    .lightbox-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; align-items: center; justify-content: space-between; z-index: 102; }
    .lightbox-close { background: #1e293b; border: 1px solid rgba(148, 163, 184, 0.35); color: #f8fafc; padding: 6px 14px; border-radius: 999px; font-family: inherit; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
    .lightbox-body { width: 100%; max-width: 580px; max-height: 82dvh; display: flex; align-items: center; justify-content: center; }
    .lightbox-body img { width: 100%; height: auto; max-height: 80dvh; object-fit: contain; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <section id="examScreen" class="exam-screen">
      <header class="top-header">
        <div class="top-header-row">
          <div class="hud-group">
            <span class="hud-pill station-pill" id="stationProgressBadge">صورة 1 / 18</span>
            <span class="hud-pill" id="questionProgressBadge">سؤال 1 / 90</span>
          </div>
          <span class="hud-pill timer-pill" id="timerBadge">⏱ 60s</span>
        </div>
        <div class="timer-track">
          <div class="timer-fill" id="timerProgressBar"></div>
        </div>
      </header>

      <div class="ct-viewer-zone" id="ctViewerZone">
        <div class="image-container" id="imageContainer"></div>
        <span class="zoom-badge" id="zoomBadge">🔍 Zoom</span>
      </div>

      <div class="sticky-diagnosis-bar state-prompt" id="stickyDiagnosisBar">
        <span class="sticky-diag-label" id="stickyDiagLabel">حدد التشخيص الصحيح من الخيارات أدناه</span>
      </div>

      <main class="mcq-workspace">
        <div class="question-header">
          <h1 class="question-text" id="questionText">1. Identify the pathology.</h1>
          <span class="timeout-tag hidden" id="timeoutBadge">انتهى الوقت</span>
        </div>
        <div class="options-grid" id="optionsGrid"></div>
      </main>

      <nav class="bottom-nav-bar">
        <button type="button" class="nav-btn nav-btn-next" id="nextBtn">→ السؤال التالي</button>
        <button type="button" class="nav-btn nav-btn-prev" id="prevBtn" disabled>السؤال السابق ←</button>
      </nav>
    </section>

    <section id="resultsScreen" class="results-screen hidden">
      <div class="score-summary-card">
        <div class="score-ring">
          <span class="score-percent" id="finalPercent">0%</span>
          <span class="score-fraction" id="finalFraction">0 / 90</span>
        </div>
        <button type="button" class="restart-exam-btn" id="restartTopBtn">🔄 إعادة الاختبار</button>
      </div>
      <div class="stations-review-list" id="stationsReviewList"></div>
      <button type="button" class="restart-exam-btn" id="restartBottomBtn">🔄 إعادة الاختبار</button>
    </section>

    <div id="lightboxModal" class="lightbox-modal hidden">
      <div class="lightbox-top">
        <span class="hud-pill station-pill" id="lightboxTitle">صورة 1 / 18</span>
        <button type="button" class="lightbox-close" id="lightboxCloseBtn">إغلاق ✕</button>
      </div>
      <div class="lightbox-body" id="lightboxBody"></div>
    </div>
  </div>

  <script>
    // Exact mapping of all 18 stations & 90 verbatim questions/answers from CT Practical Examination.pdf
    // Station 7 (Metallic Artifact) has no CT image in the PDF, so images/7.jpg..17.jpg map to Stations 8..18.
    const STATIONS = [
      {
        id: 1, img: "images/1.jpg", diagnosis: "Acute intracerebral hemorrhage",
        questions: [
          { q: "1. Identify the pathology.", a: "Acute intracerebral hemorrhage" },
          { q: "2. Describe CT findings.", a: "Hyperdense intraparenchymal hemorrhage with surrounding edema." },
          { q: "3. Mention two causes.", a: "Causes include hypertension and vascular abnormalities." },
          { q: "4. What are the complications?", a: "Complications include mass effect and intraventricular extension." },
          { q: "5. How is it treated?", a: "Treatment involves stabilization, blood pressure control and neurosurgical assessment." }
        ]
      },
      {
        id: 2, img: "images/2.jpg", diagnosis: "Acute subdural hematoma",
        questions: [
          { q: "1. Identify the pathology.", a: "Acute subdural hematoma" },
          { q: "2. Describe its shape.", a: "Crescent-shaped hyperdense extra-axial collection." },
          { q: "3. Which vessels are injured?", a: "Usually due to bridging vein injury following trauma." },
          { q: "4. What is the mechanism?", a: "Usually due to bridging vein injury following trauma." },
          { q: "5. How is it managed?", a: "Management depends on hematoma size, mass effect and neurological status." }
        ]
      },
      {
        id: 3, img: "images/3.jpg", diagnosis: "Acute epidural hematoma",
        questions: [
          { q: "1. Identify the pathology.", a: "Acute epidural hematoma" },
          { q: "2. Describe its shape.", a: "Biconvex hyperdense extra-axial collection." },
          { q: "3. Which artery is commonly injured?", a: "Commonly associated with middle meningeal artery injury and temporal bone fracture." },
          { q: "4. What associated fracture may occur?", a: "Commonly associated with middle meningeal artery injury and temporal bone fracture." },
          { q: "5. What is the treatment?", a: "Urgent neurosurgical evaluation." }
        ]
      },
      {
        id: 4, img: "images/4.jpg", diagnosis: "Acute ischemic stroke",
        questions: [
          { q: "1. Identify the pathology.", a: "Acute ischemic stroke" },
          { q: "2. What is the hyperdense MCA sign?", a: "Loss of grey-white differentiation, insular ribbon sign, sulcal effacement and hyperdense MCA." },
          { q: "3. Describe early CT signs.", a: "Loss of grey-white differentiation, insular ribbon sign, sulcal effacement and hyperdense MCA." },
          { q: "4. Which additional CT study is useful?", a: "CTA ± CT perfusion." },
          { q: "5. What are the treatment options?", a: "Eligible patients may undergo thrombolysis or mechanical thrombectomy." }
        ]
      },
      {
        id: 5, img: "images/5.jpg", diagnosis: "Beam hardening artifact",
        questions: [
          { q: "1. Identify the artifact.", a: "Beam hardening artifact" },
          { q: "2. Where is it commonly seen?", a: "Dark streaks in the posterior fossa due to preferential absorption of low-energy photons." },
          { q: "3. What causes it?", a: "Dark streaks in the posterior fossa due to preferential absorption of low-energy photons." },
          { q: "4. How does it affect image interpretation?", a: "May obscure the brainstem and cerebellum." },
          { q: "5. How can it be reduced?", a: "Reduced by correction algorithms and optimized acquisition parameters." }
        ]
      },
      {
        id: 6, img: "images/6.jpg", diagnosis: "Motion Artifact",
        questions: [
          { q: "1. Identify the artifact.", a: "Identification: Motion artifact." },
          { q: "2. What causes it?", a: "Cause: Patient movement or respiratory/cardiac motion." },
          { q: "3. How does it appear?", a: "Appearance: Blurring, ghosting and duplicated anatomical structures." },
          { q: "4. Which examinations are particularly affected?", a: "Affected studies: Chest, abdomen and brain CT." },
          { q: "5. How can it be prevented?", a: "Reduction: Patient instruction, immobilization and" }
        ]
      },
      {
        id: 7, img: "", diagnosis: "Metallic Artifact",
        questions: [
          { q: "1. Identify the artifact.", a: "Identification: Metallic streak artifact." },
          { q: "2. What are its common sources?", a: "Sources: Dental fillings, surgical clips, prostheses and implants." },
          { q: "3. Why does it occur?", a: "Cause: Beam hardening, photon starvation and related reconstruction effects." },
          { q: "4. How does it appear?", a: "Appearance: Bright and dark streaks radiating from metal." },
          { q: "5. How can it be reduced?", a: "Reduction: Metal artifact reduction algorithms, appropriate kVp and iterative" }
        ]
      },
      {
        id: 8, img: "images/7.jpg", diagnosis: "Ring Artifact",
        questions: [

          { q: "3. What is the mechanism?", a: "Usually caused by axial compression." },
          { q: "4. What is the significance of retropulsion?", a: "Vertebral body comminution, posterior wall disruption and possible retropulsion into the spinal canal." },
          { q: "5. How is it treated?", a: "Treatment depends on stability and neurological status." }
        ]
      },
      {
        id: 17, img: "images/16.jpg", diagnosis: "Chance fracture",
        questions: [
          { q: "1. Identify the fracture.", a: "Chance fracture" },
          { q: "2. Describe its orientation.", a: "Horizontal flexion-distraction fracture involving vertebral body and posterior elements." },
          { q: "3. What is the mechanism?", a: "Classically associated with seat-belt injury." },
          { q: "4. Which abdominal injuries are associated?", a: "Investigate bowel and mesenteric injuries." },
          { q: "5. How is it treated?", a: "Unstable injuries often require fixation." }
        ]
      },
      {
        id: 18, img: "images/17.jpg", diagnosis: "Vertebral compression fracture",
        questions: [
          { q: "1. Identify the abnormality.", a: "Vertebral compression fracture" },
          { q: "2. Describe vertebral morphology.", a: "Vertebral height reduction, usually anterior wedging." },
          { q: "3. What are the causes?", a: "Causes include osteoporosis, trauma and malignancy." },
          { q: "4. How can acute and chronic fractures be differentiated?", a: "MRI is more sensitive for marrow edema." },
          { q: "5. What are the treatment options?", a: "Treatment includes analgesia, mobilization and selected surgical interventions." }
        ]
      }
    ];

    const TOTAL_STATIONS = STATIONS.length;
    const QUESTIONS_PER_STATION = 5;
    const TOTAL_QUESTIONS = TOTAL_STATIONS * QUESTIONS_PER_STATION;
    const QUESTION_DURATION_SEC = 60;

    const Q1_POOL = Array.from(new Set(STATIONS.map((s) => s.questions[0].a)));
    const FOLLOWUP_POOL = Array.from(new Set(STATIONS.flatMap((s) => s.questions.slice(1).map((q) => q.a))));

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildOptions(correctText, isFirstQuestion) {
      const pool = isFirstQuestion ? Q1_POOL : FOLLOWUP_POOL;
      const distractors = shuffleArray(pool.filter((t) => t !== correctText)).slice(0, 3);
      return shuffleArray([
        { text: correctText, isCorrect: true },
        { text: distractors[0], isCorrect: false },
        { text: distractors[1], isCorrect: false },
        { text: distractors[2], isCorrect: false }
      ]);
    }

    const state = {
      currentGlobalIndex: 0,
      records: [],
      countdownInterval: null,
      revealTimeout: null,
      pendingRevealGlobalIndex: null
    };

    const examScreen = document.getElementById("examScreen");
    const resultsScreen = document.getElementById("resultsScreen");
    const stationProgressBadge = document.getElementById("stationProgressBadge");
    const questionProgressBadge = document.getElementById("questionProgressBadge");
    const timerBadge = document.getElementById("timerBadge");
    const timerProgressBar = document.getElementById("timerProgressBar");
    const ctViewerZone = document.getElementById("ctViewerZone");
    const imageContainer = document.getElementById("imageContainer");
    const zoomBadge = document.getElementById("zoomBadge");
    const stickyDiagnosisBar = document.getElementById("stickyDiagnosisBar");
    const stickyDiagLabel = document.getElementById("stickyDiagLabel");
    const questionText = document.getElementById("questionText");
    const timeoutBadge = document.getElementById("timeoutBadge");
    const optionsGrid = document.getElementById("optionsGrid");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const lightboxModal = document.getElementById("lightboxModal");
    const lightboxTitle = document.getElementById("lightboxTitle");
    const lightboxBody = document.getElementById("lightboxBody");

    function stopCountdown() {
      if (state.countdownInterval !== null) {
        clearInterval(state.countdownInterval);
        state.countdownInterval = null;
      }
    }

    function finalizePendingReveal() {
      if (state.revealTimeout !== null) {
        clearTimeout(state.revealTimeout);
        state.revealTimeout = null;
      }
      if (state.pendingRevealGlobalIndex !== null) {
        const rec = state.records[state.pendingRevealGlobalIndex];
        if (rec) rec.revealed = true;
        state.pendingRevealGlobalIndex = null;
      }
    }

    function initExam() {
      stopCountdown();
      finalizePendingReveal();
      state.currentGlobalIndex = 0;
      state.records = [];

      STATIONS.forEach((station, sIdx) => {
        station.questions.forEach((qObj, qIdx) => {
          state.records.push({
            stationIdx: sIdx,
            questionIdx: qIdx,
            options: buildOptions(qObj.a, qIdx === 0),
            status: "unanswered",
            selectedOptionIdx: null,
            revealed: false,
            remainingSeconds: QUESTION_DURATION_SEC
          });
        });
      });

      resultsScreen.classList.add("hidden");
      examScreen.classList.remove("hidden");
      renderCurrentQuestion();
    }

    function renderStationImage(container, station, isThumbnail) {
      container.innerHTML = "";
      if (!station.img) {
        if (isThumbnail) {
          container.innerHTML = '<div class="review-thumb-fallback">No CT Image</div>';
        } else {
          ctViewerZone.classList.add("no-zoom");
          zoomBadge.classList.add("hidden");
          container.innerHTML =
            '<div class="img-placeholder">' +
              '<div class="img-placeholder-title">No CT Image in File (Station ' + station.id + ')</div>' +
            '</div>';
        }
        return;
      }

      if (!isThumbnail) {
        ctViewerZone.classList.remove("no-zoom");
        zoomBadge.classList.remove("hidden");
      }

      const img = document.createElement("img");
      img.src = station.img;
      img.alt = "Station " + station.id;
      if (!isThumbnail) img.className = "ct-scan-img";

      img.onerror = function () {
        if (isThumbnail) {
          container.innerHTML = '<div class="review-thumb-fallback">ST ' + station.id + '</div>';
        } else {
          ctViewerZone.classList.add("no-zoom");
          zoomBadge.classList.add("hidden");
          container.innerHTML =
            '<div class="img-placeholder">' +
              '<div class="img-placeholder-title">Station ' + station.id + '</div>' +
              '<div class="img-placeholder-sub">' + station.img + '</div>' +
            '</div>';
        }
      };

      container.appendChild(img);
    }

    function updateTimerUI(seconds) {
      timerBadge.textContent = "⏱ " + seconds + "s";
      const pct = Math.max(0, Math.min(100, (seconds / QUESTION_DURATION_SEC) * 100));
      timerProgressBar.style.width = pct + "%";

      timerBadge.classList.remove("timer-warn", "timer-danger");
      timerProgressBar.classList.remove("timer-warn", "timer-danger");

      if (seconds <= 5) {
        timerBadge.classList.add("timer-danger");
        timerProgressBar.classList.add("timer-danger");
      } else if (seconds <= 15) {
        timerBadge.classList.add("timer-warn");
        timerProgressBar.classList.add("timer-warn");
      }
    }

    function startCountdown() {
      stopCountdown();
      const idx = state.currentGlobalIndex;
      const rec = state.records[idx];
      updateTimerUI(rec.remainingSeconds);

      if (rec.status !== "unanswered") return;

      state.countdownInterval = setInterval(function () {
        if (state.currentGlobalIndex !== idx || rec.status !== "unanswered") {
          stopCountdown();
          return;
        }
        rec.remainingSeconds -= 1;
        if (rec.remainingSeconds <= 0) {
          rec.remainingSeconds = 0;
          updateTimerUI(0);
          stopCountdown();
          rec.status = "timeout";
          rec.revealed = true;
          if (idx < TOTAL_QUESTIONS - 1) {
            state.currentGlobalIndex = idx + 1;
            renderCurrentQuestion();
          } else {
            showResultsScreen();
          }
        } else {
          updateTimerUI(rec.remainingSeconds);
        }
      }, 1000);
    }

    function updateStickyDiagnosisBanner(station, stationIdx) {
      const diagRecord = state.records[stationIdx * QUESTIONS_PER_STATION];
      if (diagRecord && diagRecord.status !== "unanswered") {
        stickyDiagnosisBar.className = "sticky-diagnosis-bar state-locked";
        stickyDiagLabel.textContent = "✓ " + station.diagnosis;
      } else {
        stickyDiagnosisBar.className = "sticky-diagnosis-bar state-prompt";
        stickyDiagLabel.textContent = "حدد التشخيص الصحيح من الخيارات أدناه";
      }
    }

    function renderCurrentQuestion() {
      const idx = state.currentGlobalIndex;
      const rec = state.records[idx];
      const station = STATIONS[rec.stationIdx];
      const qObj = station.questions[rec.questionIdx];

      stationProgressBadge.textContent = "صورة " + (rec.stationIdx + 1) + " / " + TOTAL_STATIONS;
      questionProgressBadge.textContent = "سؤال " + (idx + 1) + " / " + TOTAL_QUESTIONS;

      renderStationImage(imageContainer, station, false);
      updateStickyDiagnosisBanner(station, rec.stationIdx);

      questionText.textContent = qObj.q;
      timeoutBadge.classList.toggle("hidden", rec.status !== "timeout");

      const letters = ["A", "B", "C", "D"];
      const isLocked = rec.status !== "unanswered";
      optionsGrid.innerHTML = "";

      rec.options.forEach(function (opt, optIdx) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.disabled = isLocked;

        let iconChar = "";
        if (isLocked) {
          if (opt.isCorrect && rec.revealed) {
            btn.classList.add("opt-correct");
            iconChar = "✓";
          } else if (optIdx === rec.selectedOptionIdx && !opt.isCorrect) {
            btn.classList.add("opt-wrong");
            iconChar = "✕";
          } else {
            btn.classList.add("opt-muted");
          }
        }

        btn.innerHTML =
          '<span class="opt-key">' + letters[optIdx] + '</span>' +
          '<span class="opt-text">' + opt.text + '</span>' +
          '<span class="opt-status-icon">' + iconChar + '</span>';

        if (!isLocked) {
          btn.addEventListener("click", function () { handleOptionClick(optIdx); });
        }

        optionsGrid.appendChild(btn);
      });

      prevBtn.disabled = idx === 0;
      if (idx === TOTAL_QUESTIONS - 1) {
        nextBtn.classList.add("is-finish");
        nextBtn.textContent = "عرض النتيجة";
      } else {
        nextBtn.classList.remove("is-finish");
        nextBtn.textContent = "→ السؤال التالي";
      }

      startCountdown();
    }

    function handleOptionClick(selectedOptIdx) {
      const idx = state.currentGlobalIndex;
      const rec = state.records[idx];
      if (rec.status !== "unanswered") return;

      stopCountdown();
      const chosenOpt = rec.options[selectedOptIdx];
      rec.selectedOptionIdx = selectedOptIdx;

      const station = STATIONS[rec.stationIdx];
      const buttons = optionsGrid.querySelectorAll(".option-btn");

      if (chosenOpt.isCorrect) {
        rec.status = "correct";
        rec.revealed = true;
        buttons.forEach(function (btn, i) {
          btn.disabled = true;
          const icon = btn.querySelector(".opt-status-icon");
          if (i === selectedOptIdx) {
            btn.classList.add("opt-correct");
            icon.textContent = "✓";
          } else {
            btn.classList.add("opt-muted");
          }
        });
      } else {
        rec.status = "wrong";
        rec.revealed = false;
        state.pendingRevealGlobalIndex = idx;

        buttons.forEach(function (btn, i) {
          btn.disabled = true;
          const icon = btn.querySelector(".opt-status-icon");
          if (i === selectedOptIdx) {
            btn.classList.add("opt-wrong");
            icon.textContent = "✕";
          } else {
            btn.classList.add("opt-muted");
          }
        });

        state.revealTimeout = setTimeout(function () {
          rec.revealed = true;
          state.revealTimeout = null;
          state.pendingRevealGlobalIndex = null;

          if (state.currentGlobalIndex === idx) {
            const currentBtns = optionsGrid.querySelectorAll(".option-btn");
            rec.options.forEach(function (opt, i) {
              if (opt.isCorrect && currentBtns[i]) {
                currentBtns[i].classList.remove("opt-muted");
                currentBtns[i].classList.add("opt-correct");
                currentBtns[i].querySelector(".opt-status-icon").textContent = "✓";
              }
            });
          }
        }, 500);
      }

      updateStickyDiagnosisBanner(station, rec.stationIdx);
    }

    prevBtn.addEventListener("click", function () {
      if (state.currentGlobalIndex <= 0) return;
      stopCountdown();
      finalizePendingReveal();
      state.currentGlobalIndex -= 1;
      renderCurrentQuestion();
    });

    nextBtn.addEventListener("click", function () {
      stopCountdown();
      finalizePendingReveal();
      if (state.currentGlobalIndex < TOTAL_QUESTIONS - 1) {
        state.currentGlobalIndex += 1;
        renderCurrentQuestion();
      } else {
        showResultsScreen();
      }
    });

    ctViewerZone.addEventListener("click", function () {
      const rec = state.records[state.currentGlobalIndex];
      const station = STATIONS[rec.stationIdx];
      if (!station.img) return;
      lightboxTitle.textContent = "صورة " + station.id + " / " + TOTAL_STATIONS;
      lightboxBody.innerHTML = imageContainer.innerHTML;
      lightboxModal.classList.remove("hidden");
    });

    document.getElementById("lightboxCloseBtn").addEventListener("click", function () {
      lightboxModal.classList.add("hidden");
    });

    lightboxModal.addEventListener("click", function (e) {
      if (e.target === lightboxModal || e.target === lightboxBody) {
        lightboxModal.classList.add("hidden");
      }
    });

    function showResultsScreen() {
      stopCountdown();
      finalizePendingReveal();

      examScreen.classList.add("hidden");
      resultsScreen.classList.remove("hidden");
      resultsScreen.scrollTop = 0;

      const totalCorrect = state.records.filter((r) => r.status === "correct").length;
      const pct = Math.round((totalCorrect / TOTAL_QUESTIONS) * 100);

      document.getElementById("finalPercent").textContent = pct + "%";
      document.getElementById("finalFraction").textContent = totalCorrect + " / " + TOTAL_QUESTIONS;

      const reviewList = document.getElementById("stationsReviewList");
      reviewList.innerHTML = "";

      STATIONS.forEach(function (station, sIdx) {
        const card = document.createElement("article");
        card.className = "review-station-card";

        const topRow = document.createElement("div");
        topRow.className = "review-station-top";

        const thumbWrap = document.createElement("div");
        thumbWrap.className = "review-thumb-wrap";
        renderStationImage(thumbWrap, station, true);

        const infoDiv = document.createElement("div");
        infoDiv.className = "review-station-info";
        infoDiv.innerHTML =
          '<span class="review-station-badge">صورة ' + station.id + ' / ' + TOTAL_STATIONS + '</span>' +
          '<div class="review-station-title">' + station.diagnosis + '</div>';

        topRow.appendChild(thumbWrap);
        topRow.appendChild(infoDiv);
        card.appendChild(topRow);

        const qStack = document.createElement("div");
        qStack.className = "review-q-stack";

        station.questions.forEach(function (qObj, qIdx) {
          const rec = state.records[sIdx * QUESTIONS_PER_STATION + qIdx];
          const qBox = document.createElement("div");
          qBox.className = qIdx === 0 ? "review-q-box is-diag-q" : "review-q-box";

          let userAnswerText = "لم تتم الإجابة";
          let userAnswerClass = "txt-red";

          if (rec.status === "correct") {
            userAnswerText = rec.options[rec.selectedOptionIdx].text;
            userAnswerClass = "txt-green";
          } else if (rec.status === "wrong") {
            userAnswerText = rec.options[rec.selectedOptionIdx].text;
            userAnswerClass = "txt-red";
          } else if (rec.status === "timeout") {
            userAnswerText = "انتهى الوقت (لم تتم الإجابة)";
            userAnswerClass = "txt-red";
          }

          qBox.innerHTML =
            '<div class="review-q-prompt">' + qObj.q + '</div>' +
            '<div class="review-q-row"><span class="ar-label ' + userAnswerClass + '">إجابتك:</span> <span class="' + userAnswerClass + '">' + userAnswerText + '</span></div>' +
            (rec.status !== "correct"
              ? '<div class="review-q-row"><span class="ar-label txt-green">الإجابة الصحيحة:</span> <span class="txt-green">' + qObj.a + '</span></div>'
              : '');

          qStack.appendChild(qBox);
        });

        card.appendChild(qStack);
        reviewList.appendChild(card);
      });
    }

    document.getElementById("restartTopBtn").addEventListener("click", initExam);
    document.getElementById("restartBottomBtn").addEventListener("click", initExam);

    // Start immediately
    initExam();
  </script>
